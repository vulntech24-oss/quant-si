# cargo-deny configuration (spec §1.4): advisories, licenses, bans and sources.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Only licenses the current dependency tree uses. Extend deliberately when a new
# dependency needs another permissive license.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
# Workspace crates are unpublished (publish = false) and carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
