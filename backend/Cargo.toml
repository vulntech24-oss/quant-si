[workspace]
resolver = "3"
members = [
    "crates/qd-ai",
    "crates/qd-api",
    "crates/qd-app",
    "crates/qd-backtest",
    "crates/qd-broker-paper",
    "crates/qd-domain",
    "crates/qd-cli",
    "crates/qd-risk",
    "crates/qd-server",
    "crates/qd-store",
    "crates/qd-strategy",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
qd-domain = { path = "crates/qd-domain" }
qd-strategy = { path = "crates/qd-strategy" }
qd-risk = { path = "crates/qd-risk" }
qd-ai = { path = "crates/qd-ai" }
qd-app = { path = "crates/qd-app" }
qd-backtest = { path = "crates/qd-backtest" }
qd-broker-paper = { path = "crates/qd-broker-paper" }
qd-store = { path = "crates/qd-store" }
qd-server = { path = "crates/qd-server" }
qd-api = { path = "crates/qd-api" }
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
chacha20poly1305 = "0.10"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
csv = "1.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "rust_decimal", "json"] }
async-trait = "0.1.89"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
chrono = { version = "0.4.41", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1.37", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17", features = ["v7", "serde"] }
proptest = "1.7"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Spec §1.7: no placeholder or debugging macros in runtime code paths.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# A trading system must not crash on an unexpected value; errors are returned.
# Tests may still unwrap (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
