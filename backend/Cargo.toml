[workspace]
resolver = "3"
members = ["crates/qd-domain"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1.37", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17", features = ["v7", "serde"] }
proptest = "1.7"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Spec §1.7: no placeholder or debugging macros in runtime code paths.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# A trading system must not crash on an unexpected value; errors are returned.
# Tests may still unwrap (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
