# Transaction cost schedules for Zerodha (India).
#
# UNVERIFIED. zerodha.com was not reachable from the build environment on
# 2026-09-27, so these rates come from third-party summaries and earlier
# knowledge of Zerodha's published charges. Before any live use, the owner must
# check every rate against https://zerodha.com/charges and the exchange
# circulars, then set status = "verified" and bump `version` if anything changed.
# The Risk Gate refuses unverified schedules for live accounts.
#
# Rates are fractions of turnover written as strings ("0.001" = 0.1%), so no
# value passes through binary floating point.

# Cash equities and equity ETFs, NSE delivery.
[[schedules]]
id = "zerodha-nse-equity-delivery"
version = 1
effective_from = "2026-01-01"
venue = "nse"
instrument_kinds = ["cash_equity", "etf"]
asset_classes = ["equity"]
product = "delivery"
currency = "INR"
gst_rate = "0.18"
rounding_dp = 2

[schedules.brokerage]
rate = "0"

[[schedules.charges]]
name = "stt"                      # securities transaction tax, 0.1% both sides
applies_to = "both"
basis = { kind = "turnover", rate = "0.001" }
gst = false

[[schedules.charges]]
name = "exchange_transaction"     # NSE cash, 0.00307%
applies_to = "both"
basis = { kind = "turnover", rate = "0.0000307" }
gst = true

[[schedules.charges]]
name = "sebi_fee"                 # INR 10 per crore
applies_to = "both"
basis = { kind = "turnover", rate = "0.000001" }
gst = true

[[schedules.charges]]
name = "stamp_duty"               # 0.015% on purchases
applies_to = "purchase"
basis = { kind = "turnover", rate = "0.00015" }
gst = false

[[schedules.charges]]
name = "dp_charge"                # depository charge per scrip per day on disposals; modeled per order
applies_to = "disposal"
basis = { kind = "per_order", amount = "13" }
gst = true

[schedules.verification]
status = "unverified"
checked_on = "2026-09-27"
sources = [
    "https://zerodha.com/charges/ (not reachable from the build environment)",
    "https://v2.webnotes.in/zerodha-hidden-charges (third party)",
    "https://www.cashoverflow.in/zerodha-charges/ (third party)",
]
note = "Third-party figures. The DP charge applies per scrip per day, not per order."

