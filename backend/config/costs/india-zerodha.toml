note = "STT treatment of gold and silver ETFs is assumed (none); confirm."

# Non-agricultural commodity futures (crude oil, gold, silver), MCX carry-forward.
[[schedules]]
id = "zerodha-mcx-futures"
version = 1
effective_from = "2026-01-01"
venue = "mcx"
instrument_kinds = ["future"]
asset_classes = ["energy", "precious_metal"]
product = "margin"
currency = "INR"
gst_rate = "0.18"
rounding_dp = 2

[schedules.brokerage]
rate = "0.0003"                   # 0.03% or INR 20 per executed order, whichever is lower
max_per_order = "20"

[[schedules.charges]]
name = "ctt"                      # commodity transaction tax, 0.01% on disposals
applies_to = "disposal"
basis = { kind = "turnover", rate = "0.0001" }
gst = false

[[schedules.charges]]
name = "exchange_transaction"     # MCX futures, 0.0021%
applies_to = "both"
basis = { kind = "turnover", rate = "0.000021" }
gst = true

[[schedules.charges]]
name = "sebi_fee"
applies_to = "both"
basis = { kind = "turnover", rate = "0.000001" }
gst = true

[[schedules.charges]]
name = "stamp_duty"               # 0.002% on purchases
applies_to = "purchase"
basis = { kind = "turnover", rate = "0.00002" }
gst = false

[schedules.verification]
status = "unverified"
checked_on = "2026-09-27"
sources = [
    "https://zerodha.com/charges/ (not reachable from the build environment)",
    "https://v2.webnotes.in/zerodha-commodity-brokerage (third party)",
]
note = "Third-party figures."
