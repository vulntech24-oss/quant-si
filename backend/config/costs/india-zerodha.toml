venue = "nse"
instrument_kinds = ["etf"]
asset_classes = ["precious_metal"]
product = "delivery"
currency = "INR"
gst_rate = "0.18"
rounding_dp = 2

[schedules.brokerage]
rate = "0"

[[schedules.charges]]
name = "exchange_transaction"
applies_to = "both"
basis = { kind = "turnover", rate = "0.0000307" }
gst = true

[[schedules.charges]]
name = "sebi_fee"
applies_to = "both"
basis = { kind = "turnover", rate = "0.000001" }
gst = true

[[schedules.charges]]
name = "stamp_duty"
applies_to = "purchase"
basis = { kind = "turnover", rate = "0.00015" }
gst = false

[[schedules.charges]]
name = "dp_charge"
applies_to = "disposal"
basis = { kind = "per_order", amount = "13" }
gst = true

[schedules.verification]
status = "unverified"
checked_on = "2026-09-27"
sources = [
    "https://zerodha.com/charges/ (not reachable from the build environment)",
    "https://v2.webnotes.in/zerodha-hidden-charges (third party)",
