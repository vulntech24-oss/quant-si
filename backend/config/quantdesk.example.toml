# QuantDesk server configuration (non-secret settings only).
#
# Copy to quantdesk.toml. The database URL is read from the QD_DATABASE_URL
# environment variable and must never be written here (INV-15).

# "development" (default) or "production".
environment = "development"

# Keep local; production sits behind the reverse proxy (see deploy/).
bind = "127.0.0.1:8080"
database_max_connections = 10

# Live trading is off. Turning it on also needs environment = "production",
# a build with the live-orders feature, verified cost schedules, an armed live
# account and a strategy version at SmallCapital or Full (INV-14).
live_trading_enabled = false

# The trading account this server operates (create it with `qd account create`).
account_id = "00000000-0000-7000-8000-000000000001"

risk_config = "risk.toml"
cost_schedules = ["costs/india-zerodha.toml"]

# API keys entered in the web UI (Settings) are encrypted with a master key:
# QD_MASTER_KEY (64 hex characters) in the environment, or a key generated on
# first start in data_dir. Without either, the Settings page cannot store keys.
# data_dir = "../.data"

# Paper trading (ADR 0009). The account above must be a paper account.
# Remove this section to disable the paper runner; entries then stay halted
# because no venue can be reconciled at startup.
[paper]
initial_equity = "1000000"      # account currency
start_date = "2026-10-01"       # first trading date processed
# close_time_utc = "10:00:00"   # bar complete at 15:30 IST (default)
# slippage_ticks = "1"          # adverse ticks on market and stop fills (default)
# warm_up_days = 400            # history loaded for indicators (default)
# daily_run_utc = "13:00:00"    # automatic daily run; absent = manual runs only

# Advisory AI (ADR 0011). Shadow mode only: advice is journaled and scored,
# and never changes orders, sizes, limits, parameters or halts (INV-04).
# Disabled by default. The deterministic checklist always runs; hosted
# advisors run when switched on here or in Settings and their API key is set.
[ai]
enabled = false
# max_calls_per_day = 200        # per advisor
# timeout_seconds = 20           # per call
# [ai.checklist]
# min_comfortable_rr = "2.0"
# min_comfortable_ev_r = "0.2"
# min_comfortable_evidence = 60
# max_stop_distance = "0.10"
# max_cost_share_of_reward = "0.20"
# [ai.openai]                    # key: Settings → API keys → OpenAI
# enabled = false
# model = "gpt-6-astra"
# [ai.gemini]
# enabled = false
# model = "gemini-3.8-flash"
# [ai.xai]
# enabled = false
# model = "grok-4.7"

# Zerodha Kite (ADR 0014). Also editable in Settings. Keys go in Settings →
# API keys; log in daily with "Login with Zerodha" (tokens expire 06:00 IST).
# [kite]
# enabled = false
# user_id = "AB1234"             # your Zerodha client id; other logins are refused
# market_protection = -1         # MARKET/SL-M orders: -1 automatic, or 1-100 (%)
# stop_limit_buffer = "0.01"     # GTT stop leg limit, 1% beyond the stop
# variety = "auto"               # auto | regular | amo
# sync_bars_utc = "11:00:00"     # daily bar import (16:30 IST)
# history_days = 600
# sync_fills_minutes = 5         # fill checks during market hours (live only)

# Telegram (ADR 0014). Bot token in Settings → API keys.
# [notifications]
# enabled = false
# telegram_chat_id = "123456789"
# min_severity = "critical"      # or "warning"
# daily_summary = true

# Live trading at Zerodha (ADR 0014). Server file only: never editable in the
# web UI. Real orders also need the live-orders build, environment =
# "production", live_trading_enabled = true, verified costs, the live account
# armed with your password, and a version at SmallCapital or Full (INV-14).
# [live]
# account_id = "00000000-0000-7000-8000-000000000002"   # an account of mode live
# initial_equity = "100000"
# start_date = "2026-11-02"
# daily_run_utc = "11:30:00"     # after the bar import; absent = manual only
