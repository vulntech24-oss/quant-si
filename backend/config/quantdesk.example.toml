# QuantDesk server configuration (non-secret settings only).
#
# Copy to quantdesk.toml. The database URL is read from the QD_DATABASE_URL
# environment variable and must never be written here (INV-15).

# "development" (default) or "production".
environment = "development"

# Keep local; production sits behind the reverse proxy (see deploy/).
bind = "127.0.0.1:8080"
database_max_connections = 10

# Live trading is off. Turning it on also needs environment = "production",
# a build with the live-orders feature, verified cost schedules, an armed live
# account and a strategy version at SmallCapital or Full (INV-14).
live_trading_enabled = false

# The trading account this server operates (create it with `qd account create`).
account_id = "00000000-0000-7000-8000-000000000001"

risk_config = "risk.toml"
cost_schedules = ["costs/india-zerodha.toml"]

# Paper trading (ADR 0009). The account above must be a paper account.
# Remove this section to disable the paper runner; entries then stay halted
# because no venue can be reconciled at startup.
[paper]
initial_equity = "1000000"      # account currency
start_date = "2026-10-01"       # first trading date processed
# close_time_utc = "10:00:00"   # bar complete at 15:30 IST (default)
# slippage_ticks = "1"          # adverse ticks on market and stop fills (default)
# warm_up_days = 400            # history loaded for indicators (default)
# daily_run_utc = "13:00:00"    # automatic daily run; absent = manual runs only
