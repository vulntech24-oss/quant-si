openapi: 3.1.0
info:
  title: QuantDesk API
  version: 0.1.0
  description: |
    Session cookie authentication (`qd_session`, HttpOnly, SameSite=Strict).
    Every non-GET request must send `X-Requested-With: quantdesk`.
    Decisions are always shown post-risk (INV-17). Only the owner may act;
    re-arming halts, promotions, resuming strategies and arming live trading
    also need a step-up (password re-entry in the last 5 minutes).
paths:
  /api/auth/login:
    post: {summary: Log in with username and password; sets the session cookie}
  /api/auth/logout:
    post: {summary: End the session}
  /api/auth/me:
    get: {summary: The current user, role and step-up expiry}
  /api/auth/step-up:
    post: {summary: Re-enter the password to allow dangerous actions for 5 minutes}
  /api/auth/totp:
    get: {summary: "Two-factor state of the caller: available, enabled, pending"}
  /api/auth/totp/setup:
    post: {summary: "Start TOTP enrollment (owner, step-up); returns the secret and otpauth URI once"}
  /api/auth/totp/enable:
    post: {summary: "Turn TOTP on with a current code, body {code} (owner, step-up)"}
  /api/auth/totp/disable:
    post: {summary: "Turn TOTP off with a current code, body {code} (owner, step-up)"}
  /api/auth/sessions:
    get: {summary: "The caller's sessions (id, created, expires, current); never tokens"}
  /api/auth/sessions/revoke-all:
    post: {summary: "Log out everywhere, this session included"}
  /api/auth/sessions/{id}:
    delete: {summary: Revoke one of the caller's sessions}
  /api/status:
    get: {summary: Environment, account mode, live flags, halt state (unknown counts as halted)}
  /api/decisions:
    get: {summary: Latest decisions, post-risk headline and NO TRADE reason; query limit, before}
  /api/decisions/{id}:
    get: {summary: One decision with its full journaled record}
  /api/journal:
    get: {summary: Latest journal entries; query kind, limit, before}
  /api/halts:
    get: {summary: Every halt with its active flag}
    post: {summary: Create a manual global halt (owner)}
  /api/halts/{id}/rearm:
    post: {summary: Re-arm a halt (owner, step-up)}
  /api/strategies:
    get: {summary: Registered strategy versions and their stages}
  /api/strategies/{id}/events:
    post: {summary: Apply a stage event (owner; promote and resume need step-up)}
  /api/strategy-catalog:
    get: {summary: Strategy logic versions in this build with their parameters}
  /api/instruments:
    get: {summary: Instrument specs effective today}
    post: {summary: "Add an instrument spec version from TOML, body {toml} (owner; specs are immutable)"}
  /api/instruments/{id}/bars:
    get: {summary: Point-in-time daily bars; query from, to}
    post: {summary: "Import bars from CSV, body {csv, accept_jumps} (owner; a suspect jump refuses the import unless accepted)"}
  /api/backtests:
    post: {summary: Run a research backtest (owner)}
  /api/validations:
    post: {summary: "Validate a strategy version (walk-forward, out-of-sample, holdout, Monte Carlo) and record the evidence (owner). Body {version, instruments[], from, to, equity}"}
  /api/evidence:
    get: {summary: "Recorded evidence, newest first, optionally ?version=<id> (summaries without per-trade detail)"}
  /api/evidence/{id}:
    get: {summary: One evidence record with its full report}
  /api/ai/run:
    post: {summary: "Run advisory AI over entry decisions not yet advised (owner; 409 when disabled). Advice is shadow-only (INV-04)"}
  /api/ai/advice:
    get: {summary: "Advisory AI output, newest first, optionally ?decision=<id>"}
  /api/ai/scorecard:
    get: {summary: How each advisor's stances matched realized outcomes}
  /api/review:
    get: {summary: "Predicted vs realized review of the account's paper results: calibration bins, Brier score, EV vs realized R, and the paper-review checks per version"}
  /api/review/{version}/record:
    post: {summary: "Record a paper review of a version as evidence, pass or fail (owner). Only a passed paper review can back a promotion to a live stage"}
  /api/settings:
    get: {summary: "Editable settings sections (paper, risk, ai, validation, review) with fields, values and source (file or saved), plus read-only server facts"}
  /api/settings/{section}:
    put: {summary: "Save new values for some fields of a section (owner, step-up). Body {values: {field: value}}; validated before it is stored and audited"}
  /api/settings/{section}/reset:
    post: {summary: "Return a section to its configuration-file default (owner, step-up)"}
  /api/secrets:
    get: {summary: "The secret catalog with status only (set, when, by whom). Values are never returned"}
  /api/secrets/{name}:
    put: {summary: "Store or replace a secret, encrypted at rest (owner, step-up). Body {value}. The response carries no value"}
    delete: {summary: "Delete a secret (owner, step-up)"}
  /api/paper:
    get: {summary: "The paper book restored from the journal: last day, positions, working orders (409 if paper trading is not configured)"}
  /api/paper/run:
    post: {summary: "Process paper trading days through a date, body {through: YYYY-MM-DD} (owner; 409 when busy, not configured, or the book cannot be restored)"}
  /api/account/live-armed:
    post: {summary: Arm (owner, step-up) or disarm (owner) live trading for the live account (the configured account when no live book exists)}
  /api/instruments/{id}/quality:
    get: {summary: "Data-quality issues in the last 400 days of stored bars (gaps against the exchange calendar, suspect jumps)"}
  /api/kite:
    get: {summary: "Zerodha connection status: switches, which keys are set (never their values), last login"}
  /api/kite/login:
    post: {summary: "Start Login with Zerodha (owner); returns {url} with a one-time state valid 10 minutes"}
  /api/kite/callback:
    get: {summary: "Zerodha's redirect (request_token, state, status); no session needed; 303 to /#/broker?login=ok|failed"}
  /api/kite/sync-bars:
    post: {summary: Import completed daily bars from Kite for instruments with a kite broker reference (owner)}
  /api/kite/sync-fills:
    post: {summary: Apply Kite fills to the live book and place protection (owner; risk-reducing)}
  /api/live:
    get: {summary: "The live book: last day, positions, working orders with broker ids ({configured: false} without one)"}
  /api/live/run:
    post: {summary: "Run the live daily cycle, body {through: YYYY-MM-DD} (owner, step-up; orders still need every INV-14 condition)"}
  /api/portfolio:
    get: {summary: "Portfolio view of a book (query book=paper|live): equity curve with drawdown, exposure by bucket and asset class, P&L per strategy"}
  /api/notifications/test:
    post: {summary: Send a Telegram test message (owner)}
  /api/events:
    get: {summary: Server-sent events for new journal entries}
  /api/openapi.yaml:
    get: {summary: This document}
